# Remote policy. Internal detail (hosts, backups, CI servers) lives in the private infrastructure repo.
version: 1

fuente_de_verdad:
  remoto: forgejo
  como_empujar: "git push forgejo main"

espejo:
  remoto: origin
  url_tipica: "https://github.com/txemi/darnlang.git"
  push_directo: prohibido
  excepciones: ninguna_por_rama

respaldo_offsite:
  estado: activo_no_verificado

ci:
  job: "darnlang__forgejo"
  contexto_exigido: null
  exigido_en_forgejo: false
  motivo: >
    The job already reports on main under the context "darnlang__forgejo/pipeline/head". Setting
    contexto_exigido and flipping exigido_en_forgejo to true is a separate one-line change.
