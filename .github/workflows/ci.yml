name: ci

on:
  push:
  pull_request:

jobs:
  # Windows is in the matrix on purpose: this tool splits paths, reads git output and judges file
  # NAMES, and those are exactly where a Linux-only assumption breaks silently on somebody else's
  # machine.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # A venv, not `--system`: GitHub runners ship an externally managed interpreter, and
      # `uv pip install --system` fails on it. `uv run` then uses that venv on both OSes,
      # which is also why the Windows job could find the package but not pytest.
      - name: Tests, then the tree judged by this very checkout (shared with Jenkins)
        run: bash tools/check.sh

  # Layer 3 has two behaviours and they need two environments: WITH langdetect it must catch what
  # the cheap layers miss, WITHOUT it `--strict` must refuse rather than report clean. `[dev]` now
  # carries langdetect, so this job covers the other half — the half where the 0.1.0 regression
  # lived.
  no-strict-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests without the strict extra; --strict must then refuse, never report clean
        run: bash tools/check.sh no-strict

  # Every YAML this repo SHIPS must parse. `action.yml` shipped broken through two tags -- an
  # unquoted `": "` inside a description -- and nothing noticed, because the only thing that would
  # have loaded it is a consumer, and this repo's own CI reinvented the action's three steps by hand
  # instead of using it. A file nobody parses is a file nobody validates.
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every shipped YAML parses
        run: python3 tools/yaml_check.py

  # Dogfood. A language gate that is not clean in its own repo has no argument to make.
  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the commit-message step below needs a range to walk
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --clear   # setup-uv already makes one when given a python-version
      - run: uv pip install -e .
      # Uses its OWN composite action rather than hand-rolling the steps. That is the point of
      # shipping one: if it is broken, this build is the thing that finds out, not a consumer.
      - name: Files, commit messages and PR text — via the action this repo ships
        uses: ./
        with:
          ext: all
          version: .

  # Proves the thing a user actually types, from a clean environment and with no dev extras.
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uvx from this commit
        run: uvx --from . darnlang check --ext all
