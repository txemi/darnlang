# Privacy gate — blocks private references from reaching this public repo.
#
# WHY THIS EXISTS, and why it is here on day three rather than after an incident. A sibling public
# repo was audited in 2026-08 and real private identifiers were found in it: an organisation name,
# URLs into a private repository with an internal file path, and the same names in specs, tests, the
# changelog, pull request descriptions and release notes. No credential ever leaked — it got in
# through *examples*. A spec documents its motivating case, a PR justifies a change with real
# evidence, and the real case happened to be private. Reviewing by hand once, at launch, did not
# hold there: the references came back through ordinary feature work weeks later.
#
# This repo is exactly the shape that attracts it. Every comment in it argues from a measured case,
# and every one of those cases happened in a private repo. A hand audit at v0.3.0 came back clean;
# that is precisely the moment the sibling's audit came back clean too.
#
# WHAT IT CHECKS, and why each surface matters:
#   1. Tracked files      — recoverable with a commit, but permanent in git history.
#   2. PR title and body  — the worst surface. Rendered as public HTML, indexed by search engines,
#                           and IMPOSSIBLE to retract: editing a PR body keeps the previous text
#                           readable through the API (userContentEdits), and PR bodies cannot be
#                           deleted. Catching these before merge is the only chance there is.
#   3. Commit messages    — cannot be changed after push without rewriting history.
#
# THE PATTERN LIST IS A SECRET (`PRIVACY_DENYLIST`, one extended-regex per line) for the obvious
# reason: a list of private names cannot live in the repo it is protecting.
#
# TWO DELIBERATE CHOICES:
#   - FAIL-CLOSED on a missing secret. If the list is absent the job fails instead of passing, so a
#     misconfigured repo can never look green while checking nothing.
#   - NEVER PRINT THE MATCH. CI logs on a public repo are public, so reporting the offending text
#     would leak it in the very place meant to prevent that. Only `file:line` is printed. (Actions
#     would mask the value anyway; this does not rely on that.)
name: privacy-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for private references
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The secret goes to a file, never through argv or the log. The scan itself lives in
          # tools/privacy_gate.sh, shared with Jenkins.
          printf '%s\n' "${DENYLIST:-}" > "$RUNNER_TEMP/denylist.txt"
          if [ -n "${PR_BODY:-}${PR_TITLE:-}" ]; then
            printf '%s\n%s\n' "${PR_TITLE:-}" "${PR_BODY:-}" > "$RUNNER_TEMP/pr.txt"
            export PR_TEXT_FILE="$RUNNER_TEMP/pr.txt"
          fi
          DENYLIST_FILE="$RUNNER_TEMP/denylist.txt" bash tools/privacy_gate.sh
