# darnlink-gate — the server-side link wall of this repo.
#
# Why it exists HERE and not only in the local hooks: the local fragments
# (hooks/pre-commit.d/10-darnlink, hooks/pre-push.d/10-darnlink) fail OPEN on any machine
# without the recipe on PATH — and an external contributor of a public repo does not even
# have the hooks dispatcher configured. Their skip message says "CI covers the wall", so CI
# must actually cover it: this workflow is that cover. Without it the repo is back to the
# pattern this adoption fixed — a wall that looks protective and never looks.
#
# Mechanics (fleet-standard): no hand-rolled wrapper. The ONE generic `darnlink-gate` recipe
# is fetched from the public darnlink repo at the ref pinned in darnlink-gate.json (single
# source — bumping the pin is one edit to that json), verified against `recipe_sha256` before
# it runs (a tag is mutable; the checksum turns a moved tag into a named red build), and run
# fail-closed: on the server the gate IS the wall, and failing open there means a green build
# with zero files validated.

name: darnlink-gate

# Both branch names listed on purpose: this repo lives on `main`, but listing a branch that
# does not exist costs nothing and makes the copied-to-a-master-repo failure impossible. A
# workflow that never triggers is not red anywhere — it is nothing anywhere.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (brings uvx; uvx fetches darnlink itself, credential-less)
        uses: astral-sh/setup-uv@v5

      - name: darnlink gate (pinned recipe, checksum verified, whole repo, fail-closed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/darnlink_gate.sh
